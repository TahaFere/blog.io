<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4f0">
  <title>Fatma Nur & Taha | Nişanımız</title>
  <link rel="stylesheet" href="invite.css">
</head>
<body>
  <main class="page-shell">
    <section class="invitation-card" aria-labelledby="page-title">
      <img class="invitation-image" src="assets/davetiye.jpeg" alt="Fatma Nur ve Taha'nın nişan davetiyesi">
      <div class="invitation-caption">
        <p class="eyebrow">Birlikte güzel bir anıya</p>
        <h1 id="page-title">Nişanımıza kalan zaman</h1>
        <div class="countdown" id="countdown" aria-live="polite">
          <div class="time-box"><strong id="days">--</strong><span>gün</span></div>
          <div class="time-box"><strong id="hours">--</strong><span>saat</span></div>
          <div class="time-box"><strong id="minutes">--</strong><span>dakika</span></div>
          <div class="time-box"><strong id="seconds">--</strong><span>saniye</span></div>
        </div>
      </div>
    </section>

    <section class="upload-panel" aria-labelledby="upload-title">
      <h2 id="upload-title">Anılarınızı bizimle paylaşın</h2>
      <p>Nişan günümüzde çektiğiniz fotoğraf ve videoları aşağıdaki klasöre ekleyebilirsiniz.</p>
      <a class="drive-button" href="https://drive.google.com/drive/folders/19BkQeSWtc-KWMFVCurWb-VRZJUkbXWaQ?usp=drive_link" target="_blank" rel="noopener">Google Drive'a yükle</a>
      <p class="drive-note">Telefonunuzdan fotoğraf veya video seçip yükleyebilirsiniz.</p>
    </section>
  </main>

  <script>
    const eventDate = new Date('2026-10-11T13:00:00+03:00').getTime();
    const countdown = document.getElementById('countdown');
    const units = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds')
    };

    function updateCountdown() {
      const remaining = Math.max(0, eventDate - Date.now());
      const seconds = Math.floor(remaining / 1000);
      units.days.textContent = Math.floor(seconds / 86400);
      units.hours.textContent = String(Math.floor(seconds % 86400 / 3600)).padStart(2, '0');
      units.minutes.textContent = String(Math.floor(seconds % 3600 / 60)).padStart(2, '0');
      units.seconds.textContent = String(seconds % 60).padStart(2, '0');
      if (remaining === 0) countdown.previousElementSibling.textContent = 'Bugün nişanımız var!';
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
